name: 'Synchronize Source of Truth'
description: 'Synchronize the source of truth with the latest changes.'

branding:
  icon: 'download-cloud'
  color: 'blue'

inputs:
  sot-repository:
    description: 'The repository that serves as the source of truth.'
    required: true
    default: 'GraphicalPlayground/gp-source-of-truth'
  sot-token:
    description: 'The GitHub token to use for authentication.'
    required: false
    default: ${{ github.token }}
  sot-branch:
    description: 'The branch of the source of truth repository to synchronize from.'
    required: true
    default: 'main'
  license:
    description: >
      The license to use for the project (e.g., MIT, Apache-2.0).
      Selects which file from the SOT licenses/ directory is written as LICENSE.md.
    required: true
    default: 'MIT'
  allow-templatization:
    description: >
      Whether to expand {{GP_*}} placeholders during synchronization.
      When true, values like {{GP_REPO_NAME}} are replaced with real values.
    required: true
    default: 'true'
  custom-vars:
    description: >
      JSON object of additional template variables to expose during substitution.
      Keys are used as {{KEY}} placeholders in SOT template files.
      Example: '{"WEBSITE": "https://example.com", "DISCORD": "https://discord.gg/xxx"}'
    required: false
    default: '{}'
  file-to-sync:
    description: >
      Comma-separated list of files to synchronize from the SOT repository.
      Use LICENSE.md to sync the license file selected by the 'license' input.
      Files containing <!-- gp:protected:start --> / <!-- gp:protected:end --> markers
      are treated as partial templates: only the header and footer are overwritten
      and the region between the markers is preserved per-repository.
    required: false
    default: 'SECURITY.md,DONORS.md,CODE_OF_CONDUCT.md,README.md,CITATION.cff,LICENSE_HEADER,.github/FUNDING.yml,LICENSE.md,.mailmap,GOVERNANCE.md'
  push-changes:
    description: 'Whether to automatically commit and push changes after synchronization.'
    required: true
    default: 'true'
  target-branches:
    description: >
      Comma-separated list of branches where changes may be committed or used as
      the PR base. Commits are skipped when the current branch is not in this
      list. Use * to allow any branch.
    required: false
    default: 'main'
  create-pr:
    description: >
      When true, commits are pushed to a separate branch and a pull request is
      opened targeting the current branch instead of committing directly.
      Requires the token to have pull-request write permissions.
    required: false
    default: 'false'
  pr-branch:
    description: >
      Name of the branch created when create-pr is true.
      If the branch already exists it is reset and force-pushed.
    required: false
    default: 'sync/source-of-truth'

outputs:
  synced-count:
    description: 'Number of files successfully synchronized.'
    value: ${{ steps.sync.outputs.synced-count }}
  skipped-count:
    description: 'Number of files skipped (not found in SOT or errors).'
    value: ${{ steps.sync.outputs.skipped-count }}
  pr-url:
    description: 'URL of the pull request created when create-pr is true.'
    value: ${{ steps.sync.outputs.pr-url }}

runs:
  using: 'composite'
  steps:
    - name: 'Checkout Source of Truth'
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.sot-repository }}
        token: ${{ inputs.sot-token }}
        path: 'source-of-truth'
        ref: ${{ inputs.sot-branch }}

    - name: 'Synchronize Files'
      id: sync
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.sot-token }}
      run: |
        chmod +x ${{ github.action_path }}/sync-sot.sh

        sot_path="$(realpath source-of-truth)"

        printf '%s' "$(jq -n \
          --arg license "${{ inputs.license }}" \
          --arg sot_repository "${{ inputs.sot-repository }}" \
          --arg sot_branch "${{ inputs.sot-branch }}" \
          --arg sot_path "$sot_path" \
          --argjson allow_templatization ${{ inputs.allow-templatization }} \
          --arg files_to_sync "${{ inputs.file-to-sync }}" \
          --argjson custom_vars '${{ inputs.custom-vars }}' \
          --argjson push_changes ${{ inputs.push-changes }} \
          --arg target_branches "${{ inputs.target-branches }}" \
          --argjson create_pr ${{ inputs.create-pr }} \
          --arg pr_branch "${{ inputs.pr-branch }}" \
          '{
            "license": $license,
            "sot-repository": $sot_repository,
            "sot-branch": $sot_branch,
            "sot-path": $sot_path,
            "allow-templatization": $allow_templatization,
            "file-to-sync": $files_to_sync,
            "custom-vars": $custom_vars,
            "push-changes": $push_changes,
            "target-branches": $target_branches,
            "create-pr": $create_pr,
            "pr-branch": $pr_branch
          }'
        )" | ${{ github.action_path }}/sync-sot.sh
